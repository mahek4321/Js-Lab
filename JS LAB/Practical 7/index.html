<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <form id="signupForm" novalidate>
        <h1>Registration Form</h1>

        <div class="form-grid">
          <div class="field">
            <label for="firstName">First name:<span class="required">*</span></label>
            <input type="text" id="firstName" name="firstName" required minlength="2" />
            <small class="error-message"></small>
          </div>

          <div class="field">
            <label for="lastName">Last name:<span class="required">*</span></label>
            <input type="text" id="lastName" name="lastName" required minlength="2" />
            <small class="error-message"></small>
          </div>

          <div class="field full-width">
            <label for="birthday">Birthday:<span class="required">*</span></label>
            <input type="date" id="birthday" name="birthday" required />
            <small class="error-message"></small>
          </div>

          <div class="field">
            <label for="username">Username:<span class="required">*</span></label>
            <input type="text" id="username" name="username" required minlength="4" />
            <small class="error-message"></small>
          </div>

          <div class="field">
            <label for="email">Email:<span class="required">*</span></label>
            <input type="email" id="email" name="email" required />
            <small class="error-message"></small>
          </div>

          <div class="field full-width">
            <label for="website">Website:<span class="required">*</span></label>
            <input type="url" id="website" name="website" required placeholder="https://example.com" />
            <small class="error-message"></small>
          </div>

          <div class="field">
            <label for="password">Password:<span class="required">*</span></label>
            <input type="password" id="password" name="password" required minlength="6" />
            <small class="error-message"></small>
          </div>

          <div class="field">
            <label for="rePassword">Re-password:<span class="required">*</span></label>
            <input type="password" id="rePassword" name="rePassword" required />
            <small class="error-message"></small>
          </div>
        </div>

        <div class="checkbox-field">
          <input type="checkbox" id="terms" name="terms" required />
          <label for="terms">I agree to the terms and conditions</label>
          <small class="error-message checkbox-error"></small>
        </div>

        <button type="submit">Submit</button>
        <p id="formStatus" aria-live="polite"></p>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
