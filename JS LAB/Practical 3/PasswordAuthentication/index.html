<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Authentication System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="auth-wrapper">
      <section class="auth-card" id="authCard">
        <header class="auth-header">
          <h1>Password Authentication System</h1>
          <p>Secure login with password validation</p>
        </header>

        <form id="authForm" novalidate>
          <div class="input-group">
            <label for="username">Username</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-user"></i>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                autocomplete="username"
              />
            </div>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
              />
            </div>

            <div class="options-row">
              <label class="toggle-password">
                <input type="checkbox" id="showPassword" />
                <span>Show Password</span>
              </label>
              <span id="strengthText" class="strength-text">Strength: -</span>
            </div>

            <div class="strength-bar" aria-hidden="true">
              <span id="strengthBar"></span>
            </div>
          </div>

          <div class="button-group">
            <button type="submit" class="btn btn-primary" id="loginBtn" disabled>
              Login
            </button>
            <button type="button" class="btn btn-secondary" id="resetBtn">
              Reset
            </button>
          </div>

          <div id="messageBox" class="message" role="alert" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p></p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
